[workspace]
resolver = "2"
members = [
    "src/app",
    "src/ui",
    "src/agents",
    "src/buffer",
    "src/fuzzy",
    "src/git",
    "src/github",
    "src/worktree",
    "src/terminal",
    "src/filesystem",
    "src/process",
    "src/events",
    "src/models",
    "src/state",
    "src/commands",
]
default-members = ["src/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
gpui = { version = "0.2", features = ["runtime_shaders"] }
gpui-component = { version = "0.5", features = ["tree-sitter-languages"] }
gpui-component-assets = "0.5"
alacritty_terminal = "0.26"
git2 = "0.21"
ignore = "0.4"
notify = "8"
nucleo = "0.5"
similar = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
anyhow = "1"

helix-buffer = { path = "src/buffer" }
helix-fuzzy = { path = "src/fuzzy" }
helix-models = { path = "src/models" }
helix-events = { path = "src/events" }
helix-git = { path = "src/git" }
helix-github = { path = "src/github" }
helix-worktree = { path = "src/worktree" }
helix-terminal = { path = "src/terminal" }
helix-filesystem = { path = "src/filesystem" }
helix-process = { path = "src/process" }
helix-agents = { path = "src/agents" }
helix-state = { path = "src/state" }
helix-commands = { path = "src/commands" }
helix-ui = { path = "src/ui" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
incremental = true
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

# Release-grade codegen without the fat-LTO relink, so iterating on the app does
# not pay a whole-program optimization pass per change.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
strip = false
debug = "line-tables-only"
incremental = true
